# The project's dependencies and tool configuration (D-072).
#
# One list, read by uv, replaces requirements.txt, requirements-dev.txt and
# requirements-ml.txt. `uv.lock`, committed beside this file, pins every
# package, direct or not, to one version and its hashes, for Linux (CI and
# the images) and Windows (laptops) alike, so every machine installs the same
# bytes and a tampered download fails to install.
#
# This is a deployed service, not a library: `package = false` below means uv
# installs the dependencies and never tries to build or publish the project.
#
#   uv sync              the app and its checking tools (the "dev" group)
#   uv sync --group ml   also the embedding stack (D-052)
#   uv run pytest        anything, run in the project's environment

[project]
name = "nicheconnect-backend"
version = "0.0.0"
requires-python = "==3.14.*"
# What the running app needs, and nothing else: this is what the production
# image installs (D-063). Every pin is exact; changing one needs the
# dependency approval in CLAUDE.md section 5.
dependencies = [
    "fastapi==0.141.1",
    # Pinned although FastAPI pulls it in: FastAPI only asks for >=0.46.0,
    # and advisories in that range stay open until 1.3.1. Left unpinned, a
    # fresh install could resolve to a vulnerable Starlette (security.md
    # section 8).
    "starlette==1.6.0",
    "uvicorn[standard]==0.53.0",
    "sqlalchemy==2.0.54",
    # In the image because migrations run from it, as a step before each deploy.
    "alembic==1.20.0",
    "psycopg[binary]==3.3.6",
    "pgvector==0.5.0",
    "redis==8.1.0",
    "pydantic-settings==2.15.0",
    "slowapi==0.1.10",
    "PyJWT==2.15.0",
    # The app's HTTP client (the MSG91 sender, the timestamp authorities) and
    # Starlette's test client. The original httpx is no longer maintained
    # (D-047).
    "httpx2==2.13.0",
    # Background jobs (D-060). Durable workflows whose state lives in
    # Postgres, in DBOS's own `dbos` schema; they run inside the app, so there
    # is no broker and no new service to deploy (CLAUDE.md section 3).
    "dbos==3.1.0",
    # Checks the RFC 3161 timestamps on the deal record's daily checkpoint.
    "rfc3161-client==1.0.9",
    # Pinned although rfc3161-client pulls it in: it performs the signature
    # checks, so which version does that is ours to choose, not the resolver's.
    "cryptography==50.0.1",
    # The Mozilla root certificate list, which the timestamp checks trust.
    # Pinned directly: it once arrived only through a developer tool, and the
    # app could not start without it.
    "certifi==2026.7.22",
    # Proof files in S3 (D-065): signs the upload and view links and checks
    # the objects. Signing requests by hand is security code we should not own.
    "boto3==1.43.105",
    # Re-encodes every uploaded image so no GPS location or hidden data
    # reaches a brand (D-065). Security releases are frequent: the dependency
    # audit fails CI until it is upgraded, which is the point.
    "pillow==12.3.0",
    # Reads the numbers on cleaned proof screenshots, in a background job only
    # (D-070). Built on httpx2 2.x, the same client the app pins above.
    "anthropic==1.11.0",
]

[dependency-groups]
# The tools that check the app (D-037). The app never imports them; they are
# pinned so every laptop and CI check the code with the same versions, and so
# the dependency audit covers them too. Never in an image.
dev = [
    "pytest==9.1.1",
    "ruff==0.16.8",
    "mypy==2.3.1",
    "pytest-cov==7.1.0",
    # Pinned although pytest-cov pulls it in: unpinned, local and CI runs
    # could count branches differently (D-047).
    "coverage==7.16.1",
    # API fuzz testing (D-047). Reads docs/api/openapi.json, generates
    # thousands of requests from it and checks every answer.
    "schemathesis==4.27.5",
    # Imitates S3 in tests, so the storage code is tested without AWS (D-065).
    "moto==5.2.3",
]
# The embedding stack (D-052), deliberately apart from the app:
# 1. The API image does not need it: embedding is never on the request path.
# 2. torch's advisory surface is far larger than the rest of the project's,
#    and the strict audit covers the app and its tools, not this group.
# 3. It brings back `httpx` (D-047 replaced it) through huggingface-hub.
# torch comes from PyTorch's CPU index ([tool.uv.sources] below): the default
# wheel declares about 1.4 GB of CUDA libraries for a workload that never
# touches a GPU.
ml = [
    "torch==2.14.0+cpu",
    "sentence-transformers==6.1.0",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
# Only packages named in [tool.uv.sources] ever come from here.
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.ruff]
line-length = 90
target-version = "py314"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # import order
    "B",        # bugbear: real bugs, not style
    "UP",       # pyupgrade: stop writing Python 3.8
    "SIM",      # simplify
    "DTZ",      # naive datetimes — we care about this one a lot
    "S",        # bandit: security
    "RUF",
]
ignore = [
    # Long lines are caught by the formatter; failing twice for one thing
    # just trains people to ignore the linter.
    "E501",
]

[tool.ruff.lint.flake8-bugbear]
# B008 exists because a mutable default evaluated once is a classic bug.
# FastAPI's whole dependency system is built on exactly that call-in-a-default
# shape, and it is evaluated per request, not once. Listing them here is the
# documented fix; blanket-ignoring B008 would also hide the real bug it
# catches everywhere else.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Header",
    "fastapi.Body",
    "fastapi.Form",
    "fastapi.File",
]

[tool.ruff.lint.per-file-ignores]
# Tests assert on things a linter reads as suspicious: hard-coded fake
# credentials, asserts, and deliberately unreachable hosts.
"tests/**" = [
    "S101",  # assert is the point of a test
    "S105", "S106",  # "hardcoded password" — test-only fake values
    "S311",  # random in test data is not cryptography
    "S113",  # request timeouts in probes
]
# Migrations are generated and then hand-edited; their shape is alembic's.
"alembic/**" = ["E402", "F401"]

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]

[tool.mypy]
python_version = "3.14"
files = ["app"]
# Pydantic's own plugin: without it mypy reads every BaseSettings field as a
# required constructor argument, when they actually come from the environment.
plugins = ["pydantic.mypy"]
# redis-py ships type hints but leaves a few methods (close) unannotated.
# Exempting calls into it is narrower than turning the check off everywhere.
untyped_calls_exclude = ["redis"]
# Full strict mode, nothing relaxed. The two relaxations adopted with D-037
# were removed once the code no longer needed them (see rate_limit.py).
strict = true

[[tool.mypy.overrides]]
# Third-party packages without type information. Listing them is better than
# ignore_missing_imports globally, which would also hide our own mistakes.
module = ["slowapi.*", "pgvector.*", "limits.*", "boto3.*", "botocore.*", "moto.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Installed only where embeddings are made (the ml group, D-052), never
# in CI or the API image. embedder.py imports it inside a function for that
# reason; without this entry mypy fails wherever it is absent, which is CI.
# It failed there from PR #28 on while passing on any laptop that had it.
module = ["sentence_transformers.*", "sentence_transformers"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# Quiet by default; CI adds coverage flags explicitly.
addopts = "-q"

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
# A floor, not a goal (testing.md section 5): 80% overall here, and 90% for
# every service.py, which CI checks file by file. Missing failure-case tests
# fail review even when coverage is high. Counts branches as well as lines.
fail_under = 80
show_missing = true
skip_covered = true
