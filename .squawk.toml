# Squawk, the migration linter locked by D-047. It reads the SQL a migration
# would run and flags what would lock a busy table.
#
# scripts/lint_new_migrations.py runs it over the migrations a branch ADDS,
# never the whole chain: the 20 migrations already on main raise 47 findings
# between them, and a check that is loud about things nobody can fix is a
# check everyone learns to skip.
#
# Every exclusion below is a decision, not a convenience. Anything not listed
# here fails the build, including the ones that matter most: adding a
# required field, changing a column type, dropping an index without
# CONCURRENTLY, and missing lock or statement timeouts.

excluded_rules = [
  # Alembic already decides what has run, in its own version table. Writing
  # every statement as IF NOT EXISTS would hide a genuine conflict — two
  # migrations racing for the same object — behind a silent no-op, which is
  # the failure this rule is meant to prevent.
  "prefer-robust-stmts",

  # Schema-wide conventions, and pre-existing: 34 of the 47 findings on main
  # are VARCHAR(n) columns that Squawk would rather were TEXT with a CHECK,
  # and 5 more are integer widths. Both are real, and both are one decision
  # for the whole schema by the Data track, not something a branch adding
  # one table can answer.
  "prefer-text-field",
  "prefer-bigint-over-int",
  "prefer-bigint-over-smallint",

  # These two are the ones worth having, and they are excluded ONLY because
  # turning them on changes how migrations are written, and that is the Data
  # track's call rather than something to spring on the next migration.
  #
  # Alembic emits no timeouts, so without them a migration that needs a lock
  # can wait behind a long query and hold the queue shut while it waits. The
  # fix is two lines at the top of a migration:
  #
  #     op.execute("SET lock_timeout = '5s'")
  #     op.execute("SET statement_timeout = '30s'")
  #
  # or the same once in alembic/env.py, which is the Data track's file.
  # **Erode Harish to decide which, then delete these two lines.** That is
  # the open follow-up on D-050.
  "require-statement-timeout",
  "require-lock-timeout",
]
