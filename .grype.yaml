# Grype, the image vulnerability scanner (D-064). CI runs it on every push.
#
# The pass/fail rule lives in the CI step (.github/workflows/ci.yml), which
# prints the full report first and then fails on anything with a fix. This
# file holds only the accepted risks, so both runs, and a founder's own, read
# the same list:
#
#   grype <image> -c .grype.yaml --only-fixed --fail-on negligible

# Accepted risks. Each entry is ONE vulnerability in ONE exact package
# version, never a pattern, and says why it is accepted and when it goes.
#
# All four below are in CPython 3.14.7 itself, the newest 3.14 release on
# 1 October 2026 (D-072). Grype lists them as fixed, but only in 3.15
# pre-releases; no 3.14 release carries the fix, so there is nothing to
# upgrade to on 3.14. Because each entry names version 3.14.7, any change of
# Python brings all four back into the scan to be judged again.
#
# The upgrade from 3.12.14 fixed the other six this file used to accept
# (tarfile filters, two base64 decoding flaws, http.cookies, imaplib,
# pkgutil).
#
# Checked against our code on 1 October 2026: nothing in app/, scripts/ or
# alembic/ imports stringprep, poplib, zipfile or the lzma, bz2 and zstd
# decompressors, encodes with the idna codec, or uses urllib.request's
# password managers. The image's health check calls urllib.request.urlopen
# on localhost with no stored credentials, which the HTTPPasswordMgr flaw
# needs. That is a reading of the code, not a test.
#
# Remove each entry when a 3.14 release carries its fix.
ignore:
  - vulnerability: CVE-2026-15806
    package: { name: python, version: 3.14.7, type: binary }
    reason: "urllib.request HTTPPasswordMgr scheme matching; no password manager is used anywhere."
  - vulnerability: CVE-2025-15367
    package: { name: python, version: 3.14.7, type: binary }
    reason: "poplib command injection; not used."
  - vulnerability: CVE-2026-17084
    package: { name: python, version: 3.14.7, type: binary }
    reason: "stringprep Unicode table version (IDNA 2003); not used, and our outbound hosts are ASCII."
  - vulnerability: CVE-2026-15310
    package: { name: python, version: 3.14.7, type: binary }
    reason: "zipfile decompression pre-allocation; we never open zip files."
