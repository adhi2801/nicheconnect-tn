# Grype, the image vulnerability scanner (D-064). CI runs it on every push.
#
# The pass/fail rule lives in the CI step (.github/workflows/ci.yml), which
# prints the full report first and then fails on anything with a fix. This
# file holds only the accepted risks, so both runs, and a founder's own, read
# the same list:
#
#   grype <image> -c .grype.yaml --only-fixed --fail-on negligible

# Accepted risks. Each entry is ONE vulnerability in ONE exact package
# version, never a pattern, and says why it is accepted and when it goes.
#
# Both below are in CPython 3.14.10 itself, the newest 3.14 release on
# 29 October 2026 (D-145). Grype lists them as fixed, but only in 3.15; no
# 3.14 release carries the fix, so there is nothing to upgrade to on 3.14.
# Because each entry names version 3.14.10, any change of Python brings
# both back into the scan to be judged again.
#
# 3.14.10 fixed CVE-2026-114583, which failed CI on 3.14.8, and the tarfile
# link flaw (CVE-2026-87910) this file accepted for 3.14.8.
# 3.14.8 fixed five that this file accepted or CI caught on 3.14.7
# (urllib.request's password manager, stringprep, zipfile, and two tarfile
# path flaws); the upgrade from 3.12.14 had fixed six before that.
#
# Checked against our code on 4 October 2026, and again on 29 October
# 2026 for 3.14.10: nothing in app/, scripts/,
# alembic/ or the Dockerfile imports tarfile, tempfile or poplib, or calls
# shutil.rmtree. That is a reading of the code, not a test. pip, which uses
# tarfile, is removed from the image (Dockerfile), and uv installs from
# wheels pinned by hash at build time.
#
# A third, accepted on 31 October 2026 (D-149): CVE-2026-103995 (published
# 27 October), http.client's response parser accepting signs, spaces and 0x
# in Content-Length and chunk sizes, so a hostile server could split a
# response. Fixed only in 3.16.0 so far. Our use: boto3 (S3 proof files) and
# Sentry reach http.client through urllib3, both over verified TLS to AWS
# and Sentry; our own outbound calls (MSG91, Meta, DNS checks, timestamp
# authorities) use httpx2, whose parser is not http.client's.
#
# A fourth, accepted on 5 November 2026 (D-159): CVE-2026-116566,
# socket.getaddrinfo() accepting null bytes in the host or port and
# silently truncating there. Fixed only in 3.16.0 so far. Our use: the
# hosts we resolve are fixed (AWS, Sentry, MSG91, Meta, the two DNS-over-
# HTTPS resolvers, the timestamp authorities) or come from IANA's RDAP
# list; a brand's own domain is sent to the resolver as a query, never
# resolved by us, and must match DOMAIN_PATTERN (letters, digits, hyphens,
# dots), which the database enforces too.
#
# A fifth, accepted on 12 November 2026 (D-190): CVE-2026-119170
# (published 6 November; NVD: High, CVSS 4.0 8.2, awaiting analysis), a
# regression in how hashlib enforces FIPS algorithms. Only Python 3.14.10 is
# affected, and only when OpenSSL runs in FIPS mode. Grype names 3.14.11 as
# the fix, but no 3.14.11 is released yet (python.org and Docker Hub, checked
# 12 November 2026). Our image runs OpenSSL 3.5.7 with FIPS mode off and no
# FIPS provider installed, checked inside the image; the Dockerfile fails
# the build if FIPS mode is ever on, so this reason is enforced, not assumed.
# Remove this entry with the move to 3.14.11.
#
# Remove each entry when a 3.14 release carries its fix.
ignore:
  - vulnerability: CVE-2025-15367
    package: { name: python, version: 3.14.10, type: binary }
    reason: "poplib command injection; not used."
  - vulnerability: CVE-2026-12345
    package: { name: python, version: 3.14.10, type: binary }
    reason: "tempfile.TemporaryDirectory cleanup race; we create no temporary directories."
  - vulnerability: CVE-2026-103995
    package: { name: python, version: 3.14.10, type: binary }
    reason: "http.client response splitting; reached only via urllib3 over verified TLS to AWS S3 and Sentry (D-149)."
  - vulnerability: CVE-2026-116566
    package: { name: python, version: 3.14.10, type: binary }
    reason: "getaddrinfo null-byte truncation; we resolve only fixed hosts, and a brand domain is pattern-checked and never resolved by us (D-159)."
  - vulnerability: CVE-2026-119170
    package: { name: python, version: 3.14.10, type: binary }
    reason: "hashlib FIPS enforcement regression; applies only with OpenSSL in FIPS mode, which is off in our image and checked at build (D-190)."
