name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

# Least privilege (D-047, security.md section 8). Without this block a job
# inherits the repository default, which can include write access to code,
# packages and releases. CI only ever reads this repository.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: niche
          POSTGRES_PASSWORD: niche
          POSTGRES_DB: nicheconnect
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U niche -d nicheconnect"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      # The rate-limit storage tests prove counters are shared between
      # processes, which needs a real server (D-003). Valkey since D-047;
      # the service name stays `redis` so REDIS_URL does not change.
      redis:
        image: valkey/valkey:9.1.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # Test-only values (security.md section 5). Never real keys.
    env:
      DATABASE_URL: postgresql+psycopg://niche:niche@localhost:5432/nicheconnect
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: ci-test-only-signing-key-not-a-secret-0001
      OTP_HASH_KEY: ci-test-only-otp-hash-key-not-a-secret-0002

    steps:
      # Actions are pinned to a commit SHA, never a tag (D-047). A tag can be
      # moved: in March 2025 a hijacked tj-actions tag reached 23,000
      # repositories, and only the runs pinned to a SHA were safe. The version
      # in the comment is what the SHA was, so upgrades stay readable.
      #
      # persist-credentials: false stops checkout leaving a usable push token
      # in .git/config for every later step to read.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      # D-047 locks zizmor as the workflow auditor. It reads the files in
      # .github/workflows and fails on unpinned actions, over-broad
      # permissions and credential leaks between steps. It runs before the
      # dependencies install because it needs none of them, so a workflow
      # problem is reported in seconds rather than after the whole suite.
      #
      # Pinned but deliberately not in requirements.txt, like pip-audit
      # below: it is a CI tool and has no business in the running app.
      - name: Audit the workflows
        run: |
          pip install zizmor==1.30.1
          zizmor --persona=regular .github/workflows/

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # testing.md gate 2 (D-037). Cheapest checks first: a style or lint
      # failure should not wait behind a database and the whole test suite.
      - name: Lint
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

      # testing.md gate 3 (D-037). Strict mode on app/, configured in
      # pyproject.toml, where every relaxation is listed with its reason.
      - name: Type check
        run: mypy

      - name: Apply migrations
        run: alembic upgrade head

      # testing.md gate 4: every migration must undo itself cleanly, or a
      # broken downgrade reaches main unnoticed.
      - name: Check migrations undo and redo
        run: |
          alembic downgrade base
          alembic upgrade head

      - name: Check models match the database
        run: alembic check

      # Coverage is measured on the same run, and the 80% overall floor in
      # pyproject.toml fails it (testing.md section 5).
      - name: Run tests
        run: pytest -x --tb=short --cov --cov-report=term

      # The other half of testing.md section 5: every service.py at 90% or
      # more. coverage.py has no per-file floor, so this reads its report.
      - name: Check every service.py is at least 90% covered
        run: |
          coverage json -q -o coverage.json
          python - <<'PY'
          import json, sys
          files = json.load(open("coverage.json"))["files"]
          low = {
              name: round(data["summary"]["percent_covered"], 1)
              for name, data in files.items()
              if name.replace("\\", "/").endswith("service.py")
              and data["summary"]["percent_covered"] < 90
          }
          # ::error lines become annotations on the pull request, so the
          # file and the number are readable without opening the log.
          for name, percent in sorted(low.items()):
              print(f"::error file={name}::{name} is {percent}% covered; the floor is 90%")
          sys.exit(1 if low else 0)
          PY

      # D-047 locks Schemathesis as the API fuzz tester. It reads the OpenAPI
      # document the app serves, generates thousands of requests from it, and
      # checks every answer.
      #
      # The gate is not_a_server_error: no generated request, however strange,
      # may produce a 5xx. That is CLAUDE.md section 7's "no unhandled
      # exception reaches a user", proved on every run rather than assumed.
      #
      # The other checks are deliberately NOT gated yet. The run that added
      # this step found 14 further contract findings, listed in
      # docs/API_CONTRACT_FINDINGS.md. Turning them on before they are fixed
      # would make CI red on day one, which teaches everyone to ignore it.
      - name: Fuzz the API against its own contract
        run: |
          uvicorn app.main:app --port 8099 --log-level warning &
          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:8099/healthz > /dev/null && break
            sleep 1
          done
          schemathesis run http://127.0.0.1:8099/openapi.json \
            --max-time 120 --workers 4 --warnings off -c not_a_server_error

      # testing.md gate 6. Reads the pinned set in requirements.txt, resolves
      # everything those pins drag in, and checks the lot against the Python
      # advisory database. --strict means a package it cannot check fails the
      # build instead of being passed over quietly.
      #
      # This blocks merge on ANY known vulnerability, not only high and
      # critical ones: most Python advisories carry no severity rating, so
      # filtering by severity would let unrated ones through. Stricter wins
      # (CLAUDE.md section 7). To accept one knowingly, add --ignore-vuln
      # <ID> here with a comment saying who decided and why.
      #
      # pip-audit is pinned but deliberately not in requirements.txt: it is a
      # CI tool, and its own dependencies have no business in the running app.
      - name: Audit dependencies for known vulnerabilities
        run: |
          pip install pip-audit==2.10.1
          pip-audit --requirement requirements.txt --strict --desc
