name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

# Least privilege (D-047, security.md section 8). Without this block a job
# inherits the repository default, which can include write access to code,
# packages and releases. CI only ever reads this repository.
permissions:
  contents: read

jobs:
  test:
    # An exact runner image, never ubuntu-latest: GitHub moves that label
    # to Ubuntu 26 from 19 October 2026, and a CI that changes under us is
    # not reproducible (D-086). Moved on purpose, with a decision.
    runs-on: ubuntu-24.04

    services:
      # PostgreSQL 18 with pgvector 0.8.6, pinned exactly (D-049). Never
      # below pgvector 0.8.2: CVE-2026-3172 affects 0.6.0 to 0.8.1. CI starts
      # from an empty database every run, so the major upgrade costs it
      # nothing.
      db:
        image: pgvector/pgvector:0.8.6-pg18-trixie
        env:
          POSTGRES_USER: niche
          POSTGRES_PASSWORD: niche
          POSTGRES_DB: nicheconnect
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U niche -d nicheconnect"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      # The rate-limit storage tests prove counters are shared between
      # processes, which needs a real server (D-003). Valkey since D-047;
      # the service name stays `redis` so REDIS_URL does not change.
      redis:
        image: valkey/valkey:9.1.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # Test-only values (security.md section 5). Never real keys.
    env:
      DATABASE_URL: postgresql+psycopg://niche:niche@localhost:5432/nicheconnect
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: ci-test-only-signing-key-not-a-secret-0001
      OTP_HASH_KEY: ci-test-only-otp-hash-key-not-a-secret-0002

    steps:
      # Actions are pinned to a commit SHA, never a tag (D-047). A tag can be
      # moved: in March 2025 a hijacked tj-actions tag reached 23,000
      # repositories, and only the runs pinned to a SHA were safe. The version
      # in the comment is what the SHA was, so upgrades stay readable.
      #
      # persist-credentials: false stops checkout leaving a usable push token
      # in .git/config for every later step to read.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Squawk lints the migrations a branch ADDS, which means diffing
          # against origin/main, which needs more than the default single
          # commit of history.
          fetch-depth: 0

      # uv installs Python (the version in .python-version) and exactly what
      # uv.lock pins (D-072). uv itself is pinned too, so CI and laptops run
      # the same resolver.
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.23"

      # D-047 locks zizmor as the workflow auditor. It reads the files in
      # .github/workflows and fails on unpinned actions, over-broad
      # permissions and credential leaks between steps. It runs before the
      # dependencies install because it needs none of them, so a workflow
      # problem is reported in seconds rather than after the whole suite.
      #
      # Pinned but deliberately not in the project's dependencies, like
      # pip-audit below: uvx runs it in an environment of its own, so a CI tool
      # never touches the app's.
      - name: Audit the workflows
        run: uvx zizmor@1.30.1 --persona=regular .github/workflows/

      # Secret scanning (security.md section 6, D-082). Gitleaks reads every
      # commit on the branch, not only the latest files, because a key deleted
      # in a later commit is still in the history anyone with the repository
      # can read. Installed like Grype: the release binary, pinned by version
      # AND checksum (the checksum comes from the release's
      # gitleaks_<version>_checksums.txt). Chosen over TruffleHog because it
      # never sends a found key to an outside service to test it.
      # Findings that are not secrets are listed one by one, by exact
      # fingerprint, in .gitleaksignore.
      - name: Scan the history for secrets
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl -sSfL -o "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner --exit-code 1 .

      # --locked fails the job if uv.lock is out of step with pyproject.toml,
      # so a dependency change can never reach main without its lock. The
      # environment then comes first on PATH, so every later step runs the
      # locked tools with no prefix.
      - name: Install dependencies
        run: |
          uv sync --locked
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      # testing.md gate 2 (D-037). Cheapest checks first: a style or lint
      # failure should not wait behind a database and the whole test suite.
      - name: Lint
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

      # testing.md gate 3 (D-037). Strict mode on app/, configured in
      # pyproject.toml, where every relaxation is listed with its reason.
      - name: Type check
        run: mypy

      # D-047 locks Squawk as the migration linter, D-050 wires it in. It
      # reads the SQL a new migration would run and fails on what would lock
      # a busy table: a constraint added without NOT VALID, a required column
      # added to a populated table, a column type changed, an index dropped
      # without CONCURRENTLY.
      #
      # Only the migrations this branch adds are checked, never the whole
      # chain; .squawk.toml says which rules are off and why. It needs no
      # database: Alembic emits the SQL offline.
      - name: Lint new migrations for locks
        run: |
          uv pip install squawk-cli==2.65.0
          git fetch --no-tags origin main:refs/remotes/origin/main || true
          python -m scripts.lint_new_migrations origin/main

      - name: Apply migrations
        run: alembic upgrade head

      # testing.md gate 4: every migration must undo itself cleanly, or a
      # broken downgrade reaches main unnoticed.
      - name: Check migrations undo and redo
        run: |
          alembic downgrade base
          alembic upgrade head

      - name: Check models match the database
        run: alembic check

      # Coverage is measured on the same run, and the 80% overall floor in
      # pyproject.toml fails it (testing.md section 5).
      # A failing test's name and first error line also go out as ::error
      # annotations, which anyone can read on the pull request and through
      # the API. The full log is visible only to repository admins, and a
      # red run nobody can read cannot be fixed by anyone else (10 October
      # 2026). The exit status is pytest's own, unchanged.
      - name: Run tests
        run: |
          set +e
          pytest -x --tb=short --cov --cov-report=term -rfE 2>&1 | tee pytest.log
          status=${PIPESTATUS[0]}
          grep -E '^(FAILED|ERROR) ' pytest.log | cut -c1-500 | sed 's/^/::error title=Test failed::/'
          grep -E '^E  ' pytest.log | head -n 5 | cut -c1-500 | sed 's/^/::error title=First error::/'
          exit "$status"

      # The other half of testing.md section 5: every service.py at 90% or
      # more. coverage.py has no per-file floor, so this reads its report.
      - name: Check every service.py is at least 90% covered
        run: |
          coverage json -q -o coverage.json
          python - <<'PY'
          import json, sys
          files = json.load(open("coverage.json"))["files"]
          low = {
              name: round(data["summary"]["percent_covered"], 1)
              for name, data in files.items()
              if name.replace("\\", "/").endswith("service.py")
              and data["summary"]["percent_covered"] < 90
          }
          # ::error lines become annotations on the pull request, so the
          # file and the number are readable without opening the log.
          for name, percent in sorted(low.items()):
              print(f"::error file={name}::{name} is {percent}% covered; the floor is 90%")
          sys.exit(1 if low else 0)
          PY

      # D-047 locks Schemathesis as the API fuzz tester. It reads the OpenAPI
      # document the app serves, generates thousands of requests from it, and
      # checks every answer.
      #
      # The gate is not_a_server_error: no generated request, however strange,
      # may produce a 5xx. That is CLAUDE.md section 7's "no unhandled
      # exception reaches a user", proved on every run rather than assumed.
      #
      # The other checks are deliberately NOT gated yet. The run that added
      # this step found 14 further contract findings, listed in
      # docs/API_CONTRACT_FINDINGS.md. Turning them on before they are fixed
      # would make CI red on day one, which teaches everyone to ignore it.
      - name: Fuzz the API against its own contract
        run: |
          uvicorn app.main:app --port 8099 --log-level warning &
          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:8099/healthz > /dev/null && break
            sleep 1
          done
          schemathesis run http://127.0.0.1:8099/openapi.json \
            --max-time 120 --workers 4 --warnings off -c not_a_server_error

      # testing.md gate 6. Checks exactly what uv.lock installs: every package
      # of the app and its tools, direct or not, exported from the lock (the
      # ml group stays out, D-052), against the Python advisory database.
      # --no-deps: the lock already names every package, so nothing is
      # resolved again. --strict means a package it cannot check fails the
      # build instead of being passed over quietly.
      #
      # This blocks merge on ANY known vulnerability, not only high and
      # critical ones: most Python advisories carry no severity rating, so
      # filtering by severity would let unrated ones through. Stricter wins
      # (CLAUDE.md section 7). To accept one knowingly, add --ignore-vuln
      # <ID> here with a comment saying who decided and why.
      #
      # pip-audit is pinned but deliberately not a project dependency: it is a
      # CI tool, and its own dependencies have no business in the running app.
      - name: Audit dependencies for known vulnerabilities
        run: |
          uv export --locked --no-emit-project --format requirements-txt --no-hashes > audit-requirements.txt
          uvx pip-audit@2.10.1 --requirement audit-requirements.txt --no-deps --disable-pip --strict --desc

      # Every dependency's licence is one we approved (legal.md section
      # 3.15, D-086). An allow-list, not a deny-list, so a new or unknown
      # licence fails until someone reads it. Permissive licences, plus the
      # weak copyleft ones a library may carry when we use it unchanged:
      # LGPL-3.0 (psycopg) and MPL-2.0 (certifi, pathspec, hypothesis).
      # GPL and AGPL are not on it: they need a decision first. Spelled as
      # each package declares it; a new spelling of an approved licence is
      # added here, in review.
      - name: Check dependency licences
        env:
          ALLOWED: "MIT;MIT License;MIT-0;MIT-CMU;MIT AND PSF-2.0;PSF-2.0;BSD License;BSD-2-Clause;BSD-3-Clause;Apache Software License;Apache-2.0;Apache-2.0 OR BSD-2-Clause;Apache-2.0 OR BSD-3-Clause;MPL-2.0;Mozilla Public License 2.0 (MPL 2.0);LGPL-3.0-only;ISC;ISC License (ISCL)"
        run: uvx pip-licenses@5.5.5 --python .venv/bin/python --from=mixed --allow-only="$ALLOWED"

  # The images the app ships in (D-063), built and scanned for known
  # vulnerabilities on every push (D-064). Its own job, so it runs alongside
  # the tests rather than after them.
  image:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Grype (Anchore), chosen over Trivy because Trivy's own distribution
      # was hijacked on 19 March 2026 (D-064). It is installed from the
      # release binary, pinned by version AND checksum, never through a
      # GitHub Action: a tag can be moved, a checksum cannot. An upgrade
      # changes both lines; the checksum comes from the release's
      # grype_<version>_checksums.txt.
      - name: Install Grype
        env:
          GRYPE_VERSION: "0.119.0"
          GRYPE_SHA256: 3fa2dc4b924621ab65404cf08d0b8438d896d80ab949c9d5a4ca283c36004c9b
        run: |
          archive="$RUNNER_TEMP/grype.tar.gz"
          curl -sSfL -o "$archive" \
            "https://github.com/anchore/grype/releases/download/v${GRYPE_VERSION}/grype_${GRYPE_VERSION}_linux_amd64.tar.gz"
          echo "${GRYPE_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP" grype
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Build the API image
        run: docker build --target api -t nicheconnect-api:ci .

      # Two runs over the same image. The first prints everything, including
      # what has no fix yet, so it stays visible. The second is the gate: it
      # fails on ANY vulnerability that has a fix, whatever its severity.
      # Accepted risks are in .grype.yaml, one CVE and one package version per
      # line, each with its reason.
      - name: Report every known vulnerability in the API image
        run: grype docker:nicheconnect-api:ci -c .grype.yaml

      - name: Fail on any fixable vulnerability in the API image
        run: grype docker:nicheconnect-api:ci -c .grype.yaml --only-fixed --fail-on negligible

      # The image's bill of materials (security.md section 9, D-082): every
      # package inside it, as CycloneDX, kept with the run for 90 days so
      # "were we running the affected version on that date?" has an answer.
      # Syft is Anchore's, like Grype, installed the same way. Signing the
      # image waits for a registry to push it to (infra, D-063).
      - name: Install Syft
        env:
          SYFT_VERSION: "1.54.0"
          SYFT_SHA256: 54a87372498168b2d033e876fd41fa4e8035b872699e525a57046e1f2f09c860
        run: |
          archive="$RUNNER_TEMP/syft.tar.gz"
          curl -sSfL -o "$archive" \
            "https://github.com/anchore/syft/releases/download/v${SYFT_VERSION}/syft_${SYFT_VERSION}_linux_amd64.tar.gz"
          echo "${SYFT_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP" syft

      - name: Write the API image's bill of materials
        run: |
          "$RUNNER_TEMP/syft" scan docker:nicheconnect-api:ci \
            -o cyclonedx-json=sbom-api.cdx.json -q
          python3 -c "import json; d = json.load(open('sbom-api.cdx.json')); assert d['bomFormat'] == 'CycloneDX' and d['components'], 'empty SBOM'"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-api
          path: sbom-api.cdx.json
          retention-days: 90
          if-no-files-found: error

      # The embeddings image carries CPU torch and the 1.2 GB model, so it is
      # built only for pull requests to main. Its scan reports and does not
      # fail: D-052 kept torch out of the strict audit the API is held to.
      # The build itself is still a gate, since it proves the pinned model
      # revision can be fetched.
      - name: Build the embeddings image
        if: github.event_name == 'pull_request'
        run: docker build --target embeddings -t nicheconnect-embeddings:ci .

      - name: Report known vulnerabilities in the embeddings image
        if: github.event_name == 'pull_request'
        run: grype docker:nicheconnect-embeddings:ci -c .grype.yaml

  # The OpenTofu files that describe AWS (D-062), checked on every push:
  # formatted, and each environment valid against its locked providers.
  # Until 10 October 2026 nothing checked them, so a typo surfaced only at
  # deploy time (D-086). No AWS credentials: validation reads the files
  # only. OpenTofu is installed like Gitleaks, pinned by version and
  # checksum (tofu_<version>_SHA256SUMS on the release).
  infrastructure:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install OpenTofu
        env:
          TOFU_VERSION: "1.12.6"
          TOFU_SHA256: 50a6106fa4de523d09c87af85f3db1dd47535fc005727fdca6852146476b88ec
        run: |
          archive="$RUNNER_TEMP/tofu.tar.gz"
          curl -sSfL -o "$archive"             "https://github.com/opentofu/opentofu/releases/download/v${TOFU_VERSION}/tofu_${TOFU_VERSION}_linux_amd64.tar.gz"
          echo "${TOFU_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP" tofu
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Check formatting
        run: tofu fmt -check -recursive infra

      - name: Validate every environment
        run: |
          for dir in infra/bootstrap infra/envs/staging infra/envs/production; do
            echo "::group::$dir"
            tofu -chdir="$dir" init -backend=false -input=false -lockfile=readonly
            tofu -chdir="$dir" validate
            echo "::endgroup::"
          done

  # SECURITY.md and /.well-known/security.txt send researchers to GitHub's
  # private vulnerability reporting. Switched off, that link leads nowhere
  # and a report has nowhere private to go, so CI checks the setting itself
  # (D-082; found off on 10 October). Its own job, so a failure here never
  # hides behind, or is hidden by, a test failure.
  repository-settings:
    runs-on: ubuntu-24.04
    steps:
      - name: Private vulnerability reporting is on
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          answer=$(curl -sS -w '\n%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPOSITORY/private-vulnerability-reporting")
          code=$(echo "$answer" | tail -n 1)
          if [ "$code" != "200" ]; then
            echo "::error::Could not read the setting: GitHub answered $code."
            exit 1
          fi
          if [ "$(echo "$answer" | head -n -1 | jq -r .enabled)" != "true" ]; then
            echo "::error::Private vulnerability reporting is off, so SECURITY.md's reporting link leads nowhere. Turn it on: Settings > Advanced Security > Private vulnerability reporting > Enable."
            exit 1
          fi
