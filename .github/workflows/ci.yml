name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: niche
          POSTGRES_PASSWORD: niche
          POSTGRES_DB: nicheconnect
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U niche -d nicheconnect"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      # The rate-limit storage tests prove counters are shared between
      # processes, which needs a real Redis (D-003).
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # Test-only values (security.md section 5). Never real keys.
    env:
      DATABASE_URL: postgresql+psycopg://niche:niche@localhost:5432/nicheconnect
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: ci-test-only-signing-key-not-a-secret-0001
      OTP_HASH_KEY: ci-test-only-otp-hash-key-not-a-secret-0002

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Apply migrations
        run: alembic upgrade head

      # testing.md gate 4: every migration must undo itself cleanly, or a
      # broken downgrade reaches main unnoticed.
      - name: Check migrations undo and redo
        run: |
          alembic downgrade base
          alembic upgrade head

      - name: Check models match the database
        run: alembic check

      - name: Run tests
        run: pytest -x --tb=short
